[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rankraft-py"
version = "0.1.2"
description = "Official Python client for the RankRaft AI API - how AI answer engines and AI crawlers see your brand."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RankRaft AI" }]
# 3.9 is end of life; 3.10 gives `X | Y` annotations and a usable TypedDict.
# Airflow 2.9+/3.x and dbt both run 3.10 or later.
requires-python = ">=3.10"
keywords = ["rankraft", "ai-visibility", "answer-engine-optimization", "aeo", "geo", "seo", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# One runtime dependency. httpx buys connection pooling, per-phase timeouts and
# a real async client when we add one; rebuilding that over urllib would be
# more code than the dependency, and requests has no async story.
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# Not because pd.DataFrame(rows) is hard, but because it is subtly wrong:
# dates arrive as object strings, sparse metrics as object, dimensions
# ungrouped. Owning the conversion is the point.
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://rankraft.ai"
Documentation = "https://docs.rankraft.ai"
Source = "https://github.com/RankRaft/rankraft-python"
Issues = "https://github.com/RankRaft/rankraft-python/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/rankraft"]

[tool.hatch.build.targets.sdist]
include = ["src/rankraft", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Canned JSON payloads read better on one line than wrapped.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rankraft"]

[[tool.mypy.overrides]]
# pandas ships no stubs, and the import is lazy and guarded by an ImportError
# that names the extra. Not worth a pandas-stubs dependency.
module = ["pandas.*"]
ignore_missing_imports = true
